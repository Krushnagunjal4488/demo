<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College Management Dashboard</title>

    <!-- Bootstrap CSS -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->

            <div class="col-md-2 sidebar">

                <h3 class="text-white text-center mt-3">

                    Admin Panel

                </h3>

                <ul class="nav flex-column mt-4">

                    <li class="nav-item">

                        <a class="nav-link text-white" href="#">

                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link text-white" href="#">

                            Students

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link text-white" href="#">

                            Teachers

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link text-white" href="#">

                            Courses

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link text-white" href="#">

                            Results

                        </a>

                    </li>

                </ul>

            </div>

            <!-- Main Content -->

            <div class="col-md-10 p-4">

                <h2>

                    College Management Dashboard

                </h2>

                <!-- Statistics Cards -->

                <div class="row mt-4">

                    <div class="col-md-4">

                        <div class="card bg-primary text-white">

                            <div class="card-body">

                                <h5>Total Students</h5>

                                <h2>1200</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card bg-success text-white">

                            <div class="card-body">

                                <h5>Total Teachers</h5>

                                <h2>80</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card bg-warning text-white">

                            <div class="card-body">

                                <h5>Total Courses</h5>

                                <h2>25</h2>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Table -->

                <div class="mt-5">

                    <h4>

                        Student Records

                    </h4>

                    <table class="table table-bordered table-striped">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>

                                <th>Name</th>

                                <th>Department</th>

                                <th>Year</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>101</td>

                                <td>Rahul Sharma</td>

                                <td>Computer</td>

                                <td>TE</td>

                            </tr>

                            <tr>

                                <td>102</td>

                                <td>Priya Patil</td>

                                <td>IT</td>

                                <td>BE</td>

                            </tr>

                            <tr>

                                <td>103</td>

                                <td>Amit Joshi</td>

                                <td>ENTC</td>

                                <td>SE</td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
